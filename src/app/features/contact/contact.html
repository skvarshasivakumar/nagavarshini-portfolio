<section id="contact" aria-labelledby="contact-heading" class="grain relative mx-auto max-w-3xl px-6 py-28 text-center md:px-16">
  <div appReveal>
    <p class="font-[family-name:var(--font-mono)] text-xs uppercase tracking-[0.3em] text-harvest">
      Contact
    </p>
    <h2 id="contact-heading" class="underline-scribble mt-3 font-[family-name:var(--font-display)] text-3xl font-medium tracking-tight text-bone md:text-5xl">
      Let's talk sustainability.
    </h2>
    <p class="mx-auto mt-5 max-w-md text-ash">
      Open to client-facing consulting roles in GHG accounting, BRSR readiness, and resource
      efficiency assessment.
    </p>

    <div class="mt-10 flex flex-wrap items-center justify-center gap-4">
      <a
        [href]="'mailto:' + contact.email"
        class="inline-flex items-center gap-2 rounded-full bg-harvest px-6 py-3 text-sm font-medium text-peat transition-transform hover:-translate-y-0.5"
      >
        <svg lucideMail [size]="16" aria-hidden="true"></svg>
        {{ contact.email }}
      </a>
      <a
        [href]="contact.linkedin"
        target="_blank"
        rel="noopener"
        class="inline-flex items-center gap-2 rounded-full border border-ash/30 px-6 py-3 text-sm font-medium text-bone transition-colors hover:border-fern hover:text-fern"
      >
        <svg lucideExternalLink [size]="16" aria-hidden="true"></svg>
        LinkedIn
        <span class="sr-only">(opens in a new tab)</span>
      </a>
    </div>

    <div class="mt-6 flex flex-wrap items-center justify-center gap-6 text-sm text-ash">
      <span class="inline-flex items-center gap-1.5">
        <svg lucidePhone [size]="14" aria-hidden="true"></svg>
        {{ contact.phone }}
      </span>
      <a [href]="contact.resumeUrl" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 hover:text-fern">
        <svg lucideFileDown [size]="14" aria-hidden="true"></svg>
        Download résumé
      </a>
    </div>
  </div>

  <footer class="mt-24 font-[family-name:var(--font-mono)] text-xs text-ash">
    © {{ year }} {{ contact.name }}
  </footer>
</section>
