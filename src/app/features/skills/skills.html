<section id="skills" class="bg-[var(--color-paper-dim)] dark:bg-[var(--color-night-panel)] px-6 py-28 md:px-16">
  <div class="mx-auto max-w-5xl">
    <p class="font-[family-name:var(--font-mono)] text-xs uppercase tracking-[0.3em] text-[var(--color-terracotta)]">
      Skills
    </p>
    <h2 class="mt-3 font-[family-name:var(--font-display)] text-3xl font-medium tracking-tight md:text-4xl">
      Tools of the trade
    </h2>

    <div class="mt-12 grid gap-8 md:grid-cols-3">
      @for (group of groups; track group.domain) {
        <div appReveal>
          <h3 class="font-[family-name:var(--font-mono)] text-xs uppercase tracking-wide text-[var(--color-moss)] dark:text-[var(--color-terracotta)]">
            {{ group.domain }}
          </h3>
          <ul class="mt-4 flex flex-wrap gap-2">
            @for (item of group.items; track item) {
              <li class="rounded-full border border-[var(--color-ink)]/15 dark:border-[var(--color-night-ink)]/20 bg-[var(--color-paper)] dark:bg-[var(--color-night)] px-3 py-1.5 text-sm">
                {{ item }}
              </li>
            }
          </ul>
        </div>
      }
    </div>
  </div>
</section>
