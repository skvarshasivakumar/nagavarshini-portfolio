<section id="skills" aria-labelledby="skills-heading" class="bg-bark px-6 py-28 md:px-16">
  <div class="mx-auto max-w-5xl">
    <p class="font-[family-name:var(--font-mono)] text-xs uppercase tracking-[0.3em] text-harvest">
      Skills
    </p>
    <h2 id="skills-heading" class="underline-scribble mt-3 font-[family-name:var(--font-display)] text-3xl font-medium tracking-tight text-bone md:text-4xl">
      Tools of the trade
    </h2>

    <div class="mt-12 grid gap-8 md:grid-cols-3">
      @for (group of groups; track group.domain) {
        <div appReveal>
          <h3 class="font-[family-name:var(--font-mono)] text-xs uppercase tracking-wide text-harvest">
            {{ group.domain }}
          </h3>
          <ul class="mt-4 flex flex-wrap gap-2">
            @for (item of group.items; track item) {
              <li class="rounded-full border border-loam/50 bg-loam/10 px-3 py-1.5 text-sm text-bone">
                {{ item }}
              </li>
            }
          </ul>
        </div>
      }
    </div>
  </div>
</section>
