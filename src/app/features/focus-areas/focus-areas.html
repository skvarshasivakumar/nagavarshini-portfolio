<section id="focus" class="bg-[var(--color-paper-dim)] dark:bg-[var(--color-night-panel)] px-6 py-28 md:px-16">
  <div class="mx-auto max-w-5xl">
    <p class="font-[family-name:var(--font-mono)] text-xs uppercase tracking-[0.3em] text-[var(--color-terracotta)]">
      Focus areas
    </p>
    <h2 class="mt-3 font-[family-name:var(--font-display)] text-3xl font-medium tracking-tight md:text-4xl">
      Where I work
    </h2>

    <div class="mt-12 grid gap-5 sm:grid-cols-2">
      @for (area of areas; track area.title) {
        <div
          appReveal
          [revealDelay]="area.delay"
          class="group rounded-2xl border border-[var(--color-ink)]/10 dark:border-[var(--color-night-ink)]/15 bg-[var(--color-paper)] dark:bg-[var(--color-night)] p-6 transition-colors hover:border-[var(--color-moss)]"
        >
          <div class="grid h-11 w-11 place-items-center rounded-full bg-[var(--color-moss)]/10 text-[var(--color-moss)] dark:text-[var(--color-terracotta)]">
            @switch (area.icon) {
              @case ('recycle') { <svg lucideRecycle [size]="20"></svg> }
              @case ('flame') { <svg lucideFlame [size]="20"></svg> }
              @case ('leaf') { <svg lucideLeaf [size]="20"></svg> }
              @case ('map') { <svg lucideMap [size]="20"></svg> }
            }
          </div>
          <h3 class="mt-4 font-[family-name:var(--font-display)] text-lg font-medium">{{ area.title }}</h3>
          <p class="mt-2 text-sm leading-relaxed text-[var(--color-ink-soft)] dark:text-[var(--color-night-ink)]/75">
            {{ area.description }}
          </p>
        </div>
      }
    </div>
  </div>
</section>
