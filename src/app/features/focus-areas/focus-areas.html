<section id="focus" aria-labelledby="focus-heading" class="bg-bark px-6 py-28 md:px-16">
  <div class="mx-auto max-w-5xl">
    <p class="font-[family-name:var(--font-mono)] text-xs uppercase tracking-[0.3em] text-harvest">
      Focus areas
    </p>
    <h2 id="focus-heading" class="underline-scribble mt-3 font-[family-name:var(--font-display)] text-3xl font-medium tracking-tight text-bone md:text-4xl">
      Where I work
    </h2>

    <div class="mt-12 grid gap-5 sm:grid-cols-2">
      @for (area of areas; track area.title) {
        <div
          appReveal
          [revealDelay]="area.delay"
          class="group rounded-2xl border border-ash/15 bg-peat p-6 transition-colors hover:border-fern"
        >
          <div class="grid h-11 w-11 place-items-center rounded-full bg-moss/25 text-harvest">
            @switch (area.icon) {
              @case ('recycle') { <svg lucideRecycle [size]="20" aria-hidden="true"></svg> }
              @case ('flame') { <svg lucideFlame [size]="20" aria-hidden="true"></svg> }
              @case ('coins') { <svg lucideHandCoins [size]="20" aria-hidden="true"></svg> }
              @case ('map') { <svg lucideMap [size]="20" aria-hidden="true"></svg> }
            }
          </div>
          <h3 class="mt-4 font-[family-name:var(--font-display)] text-lg font-medium text-bone">{{ area.title }}</h3>
          <p class="mt-2 text-sm leading-relaxed text-ash">
            {{ area.description }}
          </p>
        </div>
      }
    </div>
  </div>
</section>
